# Only public/ is served; the code, the config and the data are outside the document root.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    # _boot.php is included by the pages, never requested; dotfiles are never served
    <FilesMatch "^(_boot\.php|\..*)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
